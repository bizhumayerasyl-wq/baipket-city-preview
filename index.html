<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Маркетолог қаласы</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9fd3ff;font-family:system-ui,-apple-system,sans-serif;color:#fff}
  canvas{display:block;touch-action:none}
  .box{position:fixed;background:rgba(15,20,30,.82);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5}
  #hud{top:10px;left:10px}
  #hud b{color:#ffd54a}
  #msg{top:10px;left:50%;transform:translateX(-50%);text-align:center;max-width:60vw}
  #panel{right:10px;top:10px;width:250px;display:none}
  #panel label{display:flex;justify-content:space-between;margin-top:8px}
  #panel input{width:100%}
  #stats{margin-top:10px;border-top:1px solid #555;padding-top:8px;font-size:13px}
  #buy{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:none;
       background:#ffd54a;color:#222;border:0;border-radius:12px;padding:14px 22px;font-size:16px;font-weight:700;cursor:pointer}
  .good{color:#7CFC9A}.bad{color:#ff8a80}
</style>
</head>
<body>
<div id="hud" class="box"></div>
<div id="msg" class="box">WASD / бағыттауыштар немесе жерді бас — жүру.<br>Сары алаңға барып, кофейня аш.</div>
<div id="panel" class="box">
  <b>☕ Кофейня — бір күндік жоспар</b>
  <label><span>Таргет</span><span id="vT"></span></label>
  <input id="T" type="range" min="0" max="30000" step="1000" value="5000">
  <label><span>SMM</span><span id="vS"></span></label>
  <input id="S" type="range" min="0" max="30000" step="1000" value="3000">
  <label><span>Кофе бағасы</span><span id="vP"></span></label>
  <input id="P" type="range" min="700" max="2500" step="100" value="1200">
  <div id="stats">Бірінші күннің нәтижесін күт…</div>
</div>
<button id="buy">Кофейня ашу — 60 000 ₸ (E)</button>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ---------- Экономика ----------
const DAY = 8, SHOP_COST = 60000, RENT = 8000, COGS = 400, GOAL = 500000;
const g = { money: 100000, day: 1, t: 0, open: false, followers: 0, rep: 0, won: false, last: null };
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('ru-RU') + ' ₸';

function simulateDay() {
  let T = +$('T').value, S = +$('S').value; const P = +$('P').value;
  if (g.money < T + S) { T = 0; S = 0; }                  // ақша жоқ болса жарнама тоқтайды
  const conv = Math.min(.95, Math.max(.05, 1.6 - P / 1500)); // қымбат болса аз сатып алады
  const leadsT = 40 * Math.sqrt(T / 1000);                 // таргет: бірден, бірақ өсімі баяулайды
  g.followers = g.followers * .97 + 6 * Math.sqrt(S / 1000); // SMM: жазылушы жиналады
  const leadsS = g.followers * .15;
  const organic = 8 + g.rep;
  const paid = Math.round((leadsT + leadsS) * conv);
  const clients = Math.min(120, paid + Math.round(organic * conv));
  const revenue = clients * P, ads = T + S;
  const profit = revenue - clients * COGS - RENT - ads;
  g.money += profit;
  g.rep = Math.min(30, g.rep + clients / 60);              // риза клиент — сарафан
  g.last = { clients, revenue, profit, ads,
    cac: paid ? ads / paid : 0,
    roi: ads ? (paid * (P - COGS) - ads) / ads * 100 : 0 };
  spawnClients(Math.min(clients, 25));
  if (!g.won && g.money >= GOAL) { g.won = true; say('🏆 Мақсат орындалды: 500 000 ₸! Сен нағыз маркетологсың.'); }
  else if (g.money < 0) say('⚠️ Ақша минуста. Бағаны не жарнама бюджетін өзгерт.');
}

function drawUI() {
  $('hud').innerHTML = `Ақша: <b>${fmt(g.money)}</b><br>Күн: <b>${g.day}</b> · Мақсат: ${fmt(GOAL)}` +
    (g.open ? `<br>Жазылушы: <b>${Math.round(g.followers)}</b>` : '');
  $('vT').textContent = fmt($('T').value); $('vS').textContent = fmt($('S').value); $('vP').textContent = fmt($('P').value);
  const l = g.last; if (!l) return;
  const c = v => v >= 0 ? 'good' : 'bad';
  $('stats').innerHTML = `<b>Кешегі күн</b><br>Клиент: ${l.clients}<br>Түсім: ${fmt(l.revenue)}<br>Жарнама: ${fmt(l.ads)}` +
    `<br>CAC: ${l.cac ? fmt(l.cac) : '—'}<br>ROI: <span class="${c(l.roi)}">${l.ads ? Math.round(l.roi) + '%' : '—'}</span>` +
    `<br>Пайда: <span class="${c(l.profit)}">${fmt(l.profit)}</span>`;
}
const say = t => $('msg').innerHTML = t;
['T', 'S', 'P'].forEach(i => $(i).oninput = drawUI);

// ---------- Сахна ----------
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fd3ff);
scene.fog = new THREE.Fog(0x9fd3ff, 60, 130);
const cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, .1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const resize = () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); };
addEventListener('resize', resize); resize();

scene.add(new THREE.HemisphereLight(0xffffff, 0x667755, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(30, 50, 20); sun.castShadow = true;
sun.shadow.camera.left = sun.shadow.camera.bottom = -60; sun.shadow.camera.right = sun.shadow.camera.top = 60;
sun.shadow.mapSize.set(2048, 2048); scene.add(sun);

const mat = c => new THREE.MeshLambertMaterial({ color: c });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(110, 110), mat(0x4a4f57));   // асфальт
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grass = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), mat(0x7ec86a));
grass.rotation.x = -Math.PI / 2; grass.position.y = -.05; scene.add(grass);

// Қала: 5x5 квартал, ортасы — бос орын
const colliders = [], COLORS = [0xe8c9a0, 0xc9d6e8, 0xf0a58a, 0xb7dbb0, 0xd8c2ee, 0xf3e3a2];
for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) {
  const x = i * 20, z = j * 20;
  const pad = new THREE.Mesh(new THREE.BoxGeometry(14, .2, 14), mat(0xbfc4c9));
  pad.position.set(x, .1, z); pad.receiveShadow = true; scene.add(pad);
  if (!i && !j) continue;
  const h = 4 + ((i * 7 + j * 13 + 40) % 5) * 2.5;
  const b = new THREE.Mesh(new THREE.BoxGeometry(11, h, 11), mat(COLORS[(i * 3 + j * 5 + 30) % 6]));
  b.position.set(x, h / 2, z); b.castShadow = b.receiveShadow = true; scene.add(b);
  colliders.push({ x, z, r: 6 });
}
const lot = new THREE.Mesh(new THREE.BoxGeometry(14, .3, 14), new THREE.MeshLambertMaterial({ color: 0xffd54a, emissive: 0x554400 }));
lot.position.y = .15; scene.add(lot);

function buildShop() {
  scene.remove(lot);
  const s = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(10, 4, 10), mat(0x8d5a3b)); body.position.y = 2;
  const roof = new THREE.Mesh(new THREE.BoxGeometry(11.5, .6, 11.5), mat(0xd9483b)); roof.position.y = 4.3;
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
  const c = cv.getContext('2d'); c.fillStyle = '#fff8e1'; c.fillRect(0, 0, 512, 128);
  c.fillStyle = '#5d3a1a'; c.font = 'bold 72px sans-serif'; c.textAlign = 'center'; c.fillText('☕ КОФЕЙНЯ', 256, 90);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(8, 2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv) }));
  sign.position.set(0, 6, 0);
  s.add(body, roof, sign); s.traverse(o => o.castShadow = true); scene.add(s);
  shopSign = sign; colliders.push({ x: 0, z: 0, r: 5.5 });
}
let shopSign = null;

function person(color) {
  const p = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(.45, .9, 4, 8), mat(color)); body.position.y = .95;
  const head = new THREE.Mesh(new THREE.SphereGeometry(.38, 12, 12), mat(0xf2c9a0)); head.position.y = 2;
  p.add(body, head); p.traverse(o => o.castShadow = true); scene.add(p); return p;
}
const player = person(0x2f6fed); player.position.set(10, 0, 14);

// ---------- Клиенттер ----------
const npcs = [];
function spawnClients(n) {
  for (let k = 0; k < n; k++) {
    const sx = Math.random() < .5 ? 10 : -10, sz = Math.random() < .5 ? 50 : -50;
    const m = person(COLORS[k % 6]); m.position.set(sx + Math.random() * 2 - 1, 0, sz);
    npcs.push({ m, wait: Math.random() * DAY * .8, path: [[sx, 0], [Math.sign(sx) * 6, 0]] });
  }
}
function moveNpcs(dt) {
  for (let i = npcs.length - 1; i >= 0; i--) {
    const n = npcs[i]; if ((n.wait -= dt) > 0) continue;
    const [tx, tz] = n.path[0], dx = tx - n.m.position.x, dz = tz - n.m.position.z, d = Math.hypot(dx, dz);
    if (d < .4) { n.path.shift(); if (!n.path.length) { scene.remove(n.m); npcs.splice(i, 1); } continue; }
    n.m.position.x += dx / d * 7 * dt; n.m.position.z += dz / d * 7 * dt; n.m.rotation.y = Math.atan2(dx, dz);
  }
}

// ---------- Басқару ----------
const keys = {}; let target = null;
addEventListener('keydown', e => { keys[e.code] = 1; if (e.code === 'KeyE') buy(); });
addEventListener('keyup', e => keys[e.code] = 0);
const ray = new THREE.Raycaster(), v2 = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => {
  v2.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(v2, cam);
  const hit = ray.intersectObject(grass)[0]; if (hit) target = hit.point;
});
function movePlayer(dt) {
  let dx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  let dz = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  if (dx || dz) target = null;
  else if (target) { dx = target.x - player.position.x; dz = target.z - player.position.z; if (Math.hypot(dx, dz) < .3) { target = null; return; } }
  const d = Math.hypot(dx, dz); if (!d) return;
  const nx = player.position.x + dx / d * 12 * dt, nz = player.position.z + dz / d * 12 * dt;
  const free = (x, z) => Math.abs(x) < 54 && Math.abs(z) < 54 && !colliders.some(c => Math.abs(x - c.x) < c.r && Math.abs(z - c.z) < c.r);
  if (free(nx, player.position.z)) player.position.x = nx;
  if (free(player.position.x, nz)) player.position.z = nz;
  player.rotation.y = Math.atan2(dx, dz);
}
const nearLot = () => !g.open && Math.abs(player.position.x) < 9 && Math.abs(player.position.z) < 9;
function buy() {
  if (!nearLot() || g.money < SHOP_COST) return;
  g.money -= SHOP_COST; g.open = true; buildShop();
  player.position.set(10, 0, 8);
  $('panel').style.display = 'block';
  say('Кофейня ашылды! Оң жақтан бюджет пен бағаны қой.<br>Таргет бірден клиент әкеледі, SMM баяу, бірақ жиналады.');
}
$('buy').onclick = buy;

// ---------- Цикл ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05);
  movePlayer(dt); moveNpcs(dt);
  if (g.open && (g.t += dt) >= DAY) { g.t = 0; g.day++; simulateDay(); }
  $('buy').style.display = nearLot() ? 'block' : 'none';
  cam.position.set(player.position.x, 38, player.position.z + 16); cam.lookAt(player.position.x, 0, player.position.z);
  if (shopSign) shopSign.lookAt(cam.position);
  drawUI(); renderer.render(scene, cam);
});
window.__game = g;
</script>
</body>
</html>
